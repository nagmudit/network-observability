[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ato-gateway"
version = "0.1.0"
description = "Local-first network traffic inspection gateway built around mitmproxy"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mitmproxy>=11.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ato = "ato.cli:app"

[tool.setuptools.packages.find]
include = ["ato*"]

[tool.setuptools.package-data]
ato = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
